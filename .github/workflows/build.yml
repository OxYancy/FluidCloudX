name: Build FluidCloudX APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择构建类型 (Build Type)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 JDK 17 (Set up JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 设置 Gradle (Setup Gradle)
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 执行 Gradle 构建 (Build APK)
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'all' }}"
          echo "Starting build with type: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            ./gradlew assembleDebug assembleRelease --stacktrace
          fi

      - name: 整理打包 APK 产物 (Organize APK Artifacts)
        id: organize_apks
        run: |
          mkdir -p build_output
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="3.8.1-API102"

          # 收集 Debug APK
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" "build_output/FluidCloudX-${VERSION}-${SHORT_SHA}-debug.apk"
          fi

          # 收集 Release APK
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp "app/build/outputs/apk/release/app-release.apk" "build_output/FluidCloudX-${VERSION}-${SHORT_SHA}-release.apk"
          fi

          echo "Generated APK files:"
          ls -lh build_output/

      - name: 上传构建产物 (Upload Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FluidCloudX-APKs
          path: build_output/*.apk
          retention-days: 14

      - name: 发布 GitHub Release (自动为 tag 创建 Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FluidCloudX ${{ github.ref_name }}
          files: build_output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
